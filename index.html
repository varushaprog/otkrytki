<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Открытки</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border: 1px solid #ccc; }
        input, select, button { width: 100%; padding: 10px; margin-bottom: 10px; box-sizing: border-box; font-size: 16px; }
        
        button { background: #4CAF50; color: white; border: none; cursor: pointer; }
        button:disabled { background: #ccc; cursor: not-allowed; } 
        
        .history { margin-top: 30px; border-top: 2px solid #000; padding-top: 20px; }

        .card { padding: 20px; margin-bottom: 15px; border-radius: 8px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .card h3 { margin-top: 0; }
        .card p { margin: 5px 0; font-weight: bold; }

        .theme-light { background: #fff; border: 2px solid #ddd; color: #333; }
        .theme-dark { background: #333; color: #fff; border: 2px solid #111; }
        .theme-newyear { background: linear-gradient(135deg, #5973a2 0%, #8ba7d7 100%); color: white; border: 2px solid #fff; }
        .theme-valentine { background: #ffe6e6; color: #a32b2b; border: 2px solid #ea8181; }
        .theme-forest { background: #e4fdd0; color: #5bb961; border: 2px solid #b6edb8; }
    </style>
</head>
<body>

    <div class="container">
        <input type="text" id="text" placeholder="Текст">
        <input type="text" id="from" placeholder="От кого">
        <input type="text" id="to" placeholder="Кому">
        
        <select id="theme">
            <option value="theme-light">Светлая</option>
            <option value="theme-dark">Темная</option>
            <option value="theme-newyear">С НГ</option>
            <option value="theme-valentine">Типо Романтика</option>
            <option value="theme-forest">Зелёная</option>
        </select>
        
        <button id="submitBtn" disabled>Отправить</button>

        <div class="history">
            <h3>Все открытки</h3>
            <div id="historyList"></div>
        </div>
    </div>

    <script>
        const inputs = [document.getElementById('text'), document.getElementById('from'), document.getElementById('to')];
        const submitBtn = document.getElementById('submitBtn');
        const themeSelect = document.getElementById('theme');
        const historyList = document.getElementById('historyList');

        function checkInputs() {
            const isFilled = inputs.every(input => input.value.trim() !== '');
            submitBtn.disabled = !isFilled;
        }
        inputs.forEach(input => input.addEventListener('input', checkInputs));

        let history = JSON.parse(localStorage.getItem('postcards')) || [];
        renderHistory();

        submitBtn.addEventListener('click', () => {
            const newCard = {
                text: inputs[0].value,
                from: inputs[1].value,
                to: inputs[2].value,
                theme: themeSelect.value
            };

            history.push(newCard); 
            localStorage.setItem('postcards', JSON.stringify(history));
            
            renderHistory(); 
            
            inputs.forEach(input => input.value = '');
            checkInputs(); 
        });

        function renderHistory() {
            historyList.innerHTML = '';

            history.forEach(card => {
                const cardDiv = document.createElement('div');
                cardDiv.className = `card ${card.theme}`;
                
                cardDiv.innerHTML = `
                    <h3>Кому: ${card.to}</h3>
                    <p>${card.text}</p>
                    <p><small>От: ${card.from}</small></p>
                `;
                
                historyList.appendChild(cardDiv);
            });
        }
    </script>
</body>
</html>
